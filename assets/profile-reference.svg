    <g font-family="Consolas,monospace" font-size="11">
      <text x="18" y="56" fill="#79c0ff">def</text><text x="43" y="56" fill="#d2a8ff"> build_ai_system</text><text x="150" y="56" fill="#c9d1d9">():</text>
      <text x="30" y="78" fill="#8b949e">data</text><text x="64" y="78" fill="#c9d1d9"> = ingest()</text>
      <text x="30" y="100" fill="#8b949e">context</text><text x="82" y="100" fill="#c9d1d9"> = retrieve(data)</text>
      <text x="30" y="122" fill="#8b949e">answer</text><text x="77" y="122" fill="#c9d1d9"> = reason(context)</text>
      <text x="30" y="144" fill="#79c0ff">return</text><text x="72" y="144" fill="#3fb950"> deploy(answer)</text>
    </g>
    <path d="M-18 165 H282 L246 181 H18 Z" fill="#152435" stroke="#2a3e55"/>
  </g>

