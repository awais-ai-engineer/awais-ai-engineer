<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Awais Irshad AI Engineer GitHub profile</title>
  <desc id="desc">Dark professional GitHub profile layout inspired by the provided reference, with hero banner, tech stack, featured repositories, contribution activity and profile stats.</desc>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="52%" stop-color="#0a1830"/>
      <stop offset="100%" stop-color="#07101a"/>
    </linearGradient>
    <linearGradient id="blueText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10233b"/>
      <stop offset="100%" stop-color="#09131f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
